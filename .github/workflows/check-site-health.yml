name: Check site availability

on:
  schedule:
    # Run away from the top of the hour to reduce schedule congestion.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feira-boa-site-health
  cancel-in-progress: true

jobs:
  check-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check site and public data files
        run: node scripts/check-site-health.mjs
