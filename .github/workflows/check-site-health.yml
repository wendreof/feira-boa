name: Check site availability

on:
  schedule:
    # Run away from the top of the hour to reduce schedule congestion.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feira-boa-site-health
  cancel-in-progress: true

jobs:
  check-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      EXPECTED_COMMIT: ${{ github.sha }}
      REQUIRE_SECURITY_HEADERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Skip quietly when the variable is missing so an unset SITE_URL does not
      # open/update an ops issue every hour; the annotation shows in the run.
      - name: Warn when SITE_URL is not configured
        if: env.SITE_URL == ''
        run: echo "::warning::SITE_URL Actions variable is not set; health check skipped."

      - name: Check site and public data files
        if: env.SITE_URL != ''
        run: node scripts/check-site-health.mjs

      - name: Open or update failure issue
        if: failure() && env.SITE_URL != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-issue.mjs "[ops] Site health check failed"
