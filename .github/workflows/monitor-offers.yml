name: Ingest and monitor official offer sources

on:
  push:
    branches: [main]
    # Doc-only pushes do not need a 25-minute ingestion run.
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    # Four times a day: 06:00, 09:00, 15:00, and 18:00 America/Sao_Paulo (UTC-3) = 09:00, 12:00, 18:00, and 21:00 UTC.
    # GitHub may start scheduled jobs late; workflow_dispatch still allows a manual run.
    - cron: "0 9,12,18,21 * * *"
  workflow_dispatch:
    inputs:
      store:
        description: "Store to ingest (all, sempre, paguemenos, bigbom, corso, spani, spasso, fortemix)"
        required: false
        default: "all"
      path_or_url:
        description: "Custom path or URL for the store (e.g. /acougue, /hortifruti, flyer URL, etc.)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  # Serialize feed commits; cancel stale runs when main gets several pushes in a row.
  group: feira-boa-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Log scheduled time (São Paulo)
        run: |
          echo "Workflow event: ${{ github.event_name }}"
          TZ=America/Sao_Paulo date +"Local time: %Y-%m-%d %H:%M %Z"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OCR for Corso flyer adapter
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Ingest live offers
        run: |
          if [ -n "${{ github.event.inputs.store }}" ] && [ "${{ github.event.inputs.store }}" != "all" ]; then
            node scripts/ingest-offers.mjs --store "${{ github.event.inputs.store }}" --path "${{ github.event.inputs.path_or_url }}"
          else
            npm run ingest:offers
          fi

      - name: Check official flyer sources
        id: monitor
        continue-on-error: true
        run: npm run monitor:sources

      - name: Clear source review when new snapshots pass plausibility checks
        run: node scripts/apply-plausibility-review.mjs

      - name: Verify ingest freshness
        run: node scripts/post-ingest-health.mjs

      - name: Save updated offers and source status
        id: changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tracked=(
            state/
            offers.json
            offers-jsonld.js
            snapshot-manifest.json
            source-status.js
            .offer-monitor-state.json
          )
          if ! git diff --quiet -- "${tracked[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${tracked[@]}"
            git commit -m "Update automated store offers and source status"
            if ! git diff --quiet; then
              echo "Uncommitted changes remain (add them to the workflow commit list):" >&2
              git status --short >&2
              exit 1
            fi
            remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            commit_msg="Update automated store offers and source status"
            for attempt in 1 2 3 4 5; do
              git fetch "$remote" main
              if ! git pull --rebase "$remote" main; then
                git rebase --abort 2>/dev/null || true
                git fetch "$remote" main
                git reset --soft FETCH_HEAD
                git commit -m "$commit_msg"
              fi
              if git push "$remote" HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep "$((attempt * 5))"
            done
            echo "Push failed after rebase retries (main moved again)." >&2
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update failure issue
        if: steps.monitor.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-issue.mjs "[ops] Source monitor failed"

      - name: Fail the workflow after saving state
        if: steps.monitor.outcome == 'failure'
        run: exit 1
