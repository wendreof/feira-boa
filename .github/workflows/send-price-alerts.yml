name: Send price alerts

on:
  # After scheduled ingest only (08:00 / 18:00 America/Sao_Paulo). Push-to-main
  # ingest still updates offers.json but does not trigger alert sends.
  workflow_run:
    workflows: ["Ingest and monitor official offer sources"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feira-boa-price-alerts
  cancel-in-progress: false

jobs:
  send-matching-offers:
    # workflow_run.event = ingest trigger (push | schedule | workflow_dispatch).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://muiuvmhzzbqflxznpnez.supabase.co
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sempre o main atual: a ingestão acabou de commitar offers.json nele.
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build the shared feed
        run: npm ci && npm run build

      - name: Match offers and send opted-in alerts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: node scripts/send-price-alerts.mjs

      - name: Open or update failure issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-issue.mjs "[ops] Price alert job failed"
