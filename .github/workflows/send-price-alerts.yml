name: Send price alerts

on:
  schedule:
    # Daily at 09:31 São Paulo time; scheduled runs may start late.
    - cron: "31 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feira-boa-price-alerts
  cancel-in-progress: false

jobs:
  send-matching-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://muiuvmhzzbqflxznpnez.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PUBLIC_KEY: BLFV8pgkW21YRHFS_q-8tm5X6YZBghDNTrxUyvOEhJYSc9QmVXjbEStxd_R-7ndf5B4NrUcIdpcvTtS-OAfreyg
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.SITE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build the shared feed
        run: npm ci && npm run build

      - name: Match offers and send opted-in alerts
        run: node scripts/send-price-alerts.mjs
