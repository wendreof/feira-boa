name: Send price alerts

on:
  schedule:
    # 10:23 and 21:23 UTC = 07:23 and 18:23 São Paulo (UTC-3),
    # ~15 min after each ingestion run so alerts see fresh prices.
    - cron: "23 10,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feira-boa-price-alerts
  cancel-in-progress: false

jobs:
  send-matching-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://muiuvmhzzbqflxznpnez.supabase.co
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build the shared feed
        run: npm ci && npm run build

      - name: Match offers and send opted-in alerts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/send-price-alerts.mjs

      - name: Open or update failure issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-issue.mjs "[ops] Price alert job failed"
