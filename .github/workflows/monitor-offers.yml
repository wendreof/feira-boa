name: Monitor official offer sources

on:
  push:
    branches: [main]
  schedule:
    # 12:17 UTC = 09:17 in São Paulo; avoid the top of the hour.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feira-boa-pages
  cancel-in-progress: true

jobs:
  monitor-official-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check official flyer sources
        run: python scripts/monitor_sources.py

      - name: Save changed source status
        id: changes
        shell: bash
        run: |
          if ! git diff --quiet -- source-status.js .offer-monitor-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source-status.js .offer-monitor-state.json
            git commit -m "Update official source change status"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

